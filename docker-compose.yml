services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prm
      POSTGRES_PASSWORD: prm
      POSTGRES_DB: prm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm -d prm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - prm-net

  api:
    build: .
    command: >
      sh -c "python -m prm.infrastructure.db.wait_for_postgres &&
             alembic upgrade head &&
             python -m prm.infrastructure.db.seed &&
             python -m prm.api"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prm:prm@postgres:5432/prm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prm-net

  console:
    build: .
    command: python -m prm.console
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - prm-net

networks:
  prm-net:
    driver: bridge

volumes:
  postgres_data:
