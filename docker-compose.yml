services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prm
      POSTGRES_PASSWORD: prm
      POSTGRES_DB: prm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm -d prm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             python -m prm.infrastructure.db.seed &&
             python -m prm.api"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  console:
    build: .
    command: python -m prm.console
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
