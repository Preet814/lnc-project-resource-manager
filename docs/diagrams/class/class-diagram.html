
<style>
#cd { padding: 0; overflow-x: auto; }
#cd svg { width: 100% !important; height: auto !important; font-family: var(--font-sans) !important; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 0 4px; font-size: 12px; color: var(--color-text-secondary); }
.legend-item { display: flex; align-items: center; gap: 6px; }
</style>

<p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 8px;">
  PRM master domain class diagram — BRD §3–§4. Companion: <code>class-diagram.md</code>.
  Source of truth: <code>requirements/PRM_BRD.md</code>.
</p>

<div id="cd"></div>
<div class="legend">
  <span style="font-size:12px;font-weight:500;">Stereotypes:</span>
  <div class="legend-item">entity = persisted BRD data</div>
  <div class="legend-item">«enumeration» = fixed BRD vocabulary</div>
  <div class="legend-item">«DTO» / «interface» / «service» = supporting (not DB tables)</div>
</div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '11px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2862' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    tertiaryColor: dark ? '#3d2b1a' : '#FAEEDA',
    tertiaryBorderColor: dark ? '#BA7517' : '#EF9F27',
  },
});

const diagram = `
classDiagram
  direction TB

  %% ── Enumerations (BRD §3–§5 screens) ───────────────────────────
  class Role {
    <<enumeration>>
    ADMIN
    MANAGER
    EMPLOYEE
  }
  class UserAccountStatus {
    <<enumeration>>
    ACTIVE
    INACTIVE
  }
  class EmployeeWorkStatus {
    <<enumeration>>
    BENCH
    ALLOCATED
  }
  class SkillCategory {
    <<enumeration>>
    BACKEND
    FRONTEND
    DEVOPS
    QA
    OTHER
  }
  class ProficiencyLevel {
    <<enumeration>>
    BEGINNER
    INTERMEDIATE
    ADVANCED
  }
  class ProjectStatus {
    <<enumeration>>
    PLANNED
    ACTIVE
    ON_HOLD
  }
  class ProjectHealthStatus {
    <<enumeration>>
    ON_TRACK
    ATTENTION
    AT_RISK
  }
  class MilestoneStatus {
    <<enumeration>>
    NOT_STARTED
    IN_PROGRESS
    DONE
  }
  class AllocationStatus {
    <<enumeration>>
    ACTIVE
    ENDED
  }
  class TimesheetWeekStatus {
    <<enumeration>>
    SUBMITTED
    MISSED
  }
  class LLMProvider {
    <<enumeration>>
    GEMINI
    GROQ
  }
  class ActivityTag {
    <<enumeration>>
    BACKEND_API
    MICROSERVICES
    DATABASE_DESIGN
    WEBSOCKET
    FRONTEND
    CODE_REVIEW
    BUG_FIXING
    DEVOPS
    TESTING_QA
    DOCUMENTATION
    OTHER
  }

  %% ── Core entities (BRD domain) ───────────────────────────────────
  class User {
    <<entity>>
    -Long id
    -String fullName
    -String username
    -String email
    -String passwordHash
    -Role role
    -UserAccountStatus accountStatus
    -boolean forcePasswordChange
    -LocalDateTime createdAt
    -LocalDateTime updatedAt
    +changePassword(oldPwd, newPwd) boolean
    +requiresPasswordChange() boolean
    +deactivate() void
    +reactivate() void
  }

  class Employee {
    <<entity>>
    -Long id
    -Long userId
    -String fullName
    -String email
    -String department
    -String designation
    -EmployeeWorkStatus workStatus
    -boolean isActive
    -int currentUtilisationPercent
    -LocalDateTime createdAt
    +getAvailabilityPercent(maxWeeklyHours) int
    +isOnBench() boolean
    +isOverUtilised() boolean
    +deactivate(endDate) void
  }

  class Skill {
    <<entity>>
    -Long id
    -String name
    -SkillCategory category
    -boolean isPredefined
  }

  class EmployeeSkill {
    <<entity>>
    -Long id
    -Long employeeId
    -Long skillId
    -ProficiencyLevel proficiency
    -LocalDateTime assignedAt
  }

  class Project {
    <<entity>>
    -Long id
    -String name
    -String description
    -LocalDate startDate
    -LocalDate endDate
    -ProjectStatus status
    -Long managerUserId
    -ProjectHealthStatus healthStatus
    -LocalDateTime healthComputedAt
    +isOwnedBy(managerUserId) boolean
    +allowsAllocation() boolean
  }

  class Milestone {
    <<entity>>
    -Long id
    -Long projectId
    -String title
    -LocalDate dueDate
    -MilestoneStatus status
    -int sequenceOrder
    +isOverdue(asOfDate) boolean
  }

  class Allocation {
    <<entity>>
    -Long id
    -Long employeeId
    -Long projectId
    -int utilisationPercent
    -LocalDate fromDate
    -LocalDate toDate
    -AllocationStatus status
    -Long createdByUserId
    +isActiveOn(date) boolean
    +endAsOf(date) void
    +overlaps(other) boolean
  }

  class TimesheetWeek {
    <<entity>>
    -Long id
    -Long employeeId
    -LocalDate weekStartDate
    -TimesheetWeekStatus status
    -int totalHours
    -LocalDateTime submittedAt
    +canSubmit() boolean
    +markSubmitted() void
    +markMissed() void
  }

  class TimesheetEntry {
    <<entity>>
    -Long id
    -Long timesheetWeekId
    -Long projectId
    -int hoursWorked
    -List~ActivityTag~ activityTags
    +validateAgainst(allocation, maxWeeklyHours) ValidationResult
  }

  class SystemConfiguration {
    <<entity>>
    -Long id
    -LLMProvider llmProvider
    -String llmApiKeyEncrypted
    -int schedulerIntervalHours
    -int maxWeeklyHours
    +getMaxWeeklyHours() int
    +updateLlmKey(key) void
  }

  class ProjectHealthSnapshot {
    <<entity>>
    -Long id
    -Long projectId
    -ProjectHealthStatus status
    -List~String~ riskFlags
    -LocalDateTime computedAt
  }

  %% ── BRD §4.1 supporting types (not extra features) ───────────────
  class AuthToken {
    <<DTO>>
    +String token
    +Long userId
    +LocalDateTime expiresAt
    +isValid() boolean
  }

  class SkillMatchResult {
    <<DTO>>
    +Long employeeId
    +String employeeName
    +String reason
    +int suggestedAllocationPercent
    +int freeHoursPerWeek
  }

  class ILLMClient {
    <<interface>>
    +rankCandidates(context, candidates) List~SkillMatchResult~
    +summarizeRisk(context) String
  }

  class SchedulerJob {
    <<service>>
    +run() void
    +recomputeEmployeeStatus() void
    +recomputeProjectHealth() void
    +markMissedTimesheets() void
  }

  %% ── Entity associations ──────────────────────────────────────────
  User "1" --> "0..1" Employee : userId
  User "1" --> "*" Project : managerUserId
  Employee "1" --> "*" EmployeeSkill
  Skill "1" --> "*" EmployeeSkill
  Project "1" *-- "*" Milestone
  Project "1" --> "*" Allocation
  Employee "1" --> "*" Allocation
  Employee "1" *-- "*" TimesheetWeek
  TimesheetWeek "1" *-- "*" TimesheetEntry
  TimesheetEntry "*" --> "1" Project
  Project "1" --> "0..1" ProjectHealthSnapshot

  %% ── Attribute types (enum links) ─────────────────────────────────
  User --> Role
  User --> UserAccountStatus
  Employee --> EmployeeWorkStatus
  Skill --> SkillCategory
  EmployeeSkill --> ProficiencyLevel
  Project --> ProjectStatus
  Project --> ProjectHealthStatus
  Milestone --> MilestoneStatus
  Allocation --> AllocationStatus
  TimesheetWeek --> TimesheetWeekStatus
  TimesheetEntry --> ActivityTag
  SystemConfiguration --> LLMProvider

  %% ── Scheduler and AI (BRD §4.1 scope) ───────────────────────────
  SystemConfiguration ..> SchedulerJob : interval hours
  SchedulerJob ..> Employee : workStatus utilisation
  SchedulerJob ..> Project : healthStatus
  SchedulerJob ..> TimesheetWeek : MISSED flag
  SystemConfiguration ..> ILLMClient : provider and key
  ILLMClient ..> SkillMatchResult : rankCandidates
  User ..> AuthToken : login issues token
`;

const { svg } = await mermaid.render('cd-svg', diagram);
document.getElementById('cd').innerHTML = svg;
</script>
